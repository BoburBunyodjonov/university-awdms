services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: awdms-backend
    restart: unless-stopped
    env_file:
      - apps/backend/.env.production
    # Optional: host nginx can proxy /api directly to 127.0.0.1:4000 (bypasses UI container).
    ports:
      - "${AWDMS_BACKEND_PUBLISH:-127.0.0.1:4000:4000}"
    # Uses PORT from env (if set in .env.production, must match). Drains the response
    # body or Node can leave sockets in a bad state. Do not gate frontend on this —
    # use `start_period` so migrate/seed do not mark the container "failed" too early.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||4000;const u='http://127.0.0.1:'+p+'/api/health';require('http').get(u,r=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
    networks:
      - awdms-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: awdms-frontend
    restart: unless-stopped
    # Host :80 is often taken by system nginx. Default: 127.0.0.1:8080 → point nginx to
    # http://127.0.0.1:8080 (see root .env: AWDMS_HTTP_PUBLISH).
    ports:
      - "${AWDMS_HTTP_PUBLISH:-127.0.0.1:8080}:80"
    # Do not use service_healthy here: if the health probe or migrate/DB is slow, Compose
    # refuses to start nginx and the whole site stays down. Backend still starts first.
    depends_on:
      - backend
    networks:
      - awdms-net

networks:
  awdms-net:
    driver: bridge
