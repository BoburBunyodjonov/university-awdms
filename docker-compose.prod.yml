services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: awdms-backend
    restart: unless-stopped
    env_file:
      - apps/backend/.env.production
    # Until this passes, the API is not listening — nginx was returning 502 if frontend
    # started first. `start_period` allows migrate/seed to finish before failures count.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s
    networks:
      - awdms-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: awdms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - awdms-net

networks:
  awdms-net:
    driver: bridge
