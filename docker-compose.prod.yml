services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: awdms-backend
    restart: unless-stopped
    env_file:
      - apps/backend/.env.production
    networks:
      - awdms-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: awdms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - awdms-net

networks:
  awdms-net:
    driver: bridge
