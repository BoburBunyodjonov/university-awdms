server {
  listen 80;
  server_name _;

  # Docker’s internal DNS — required when using a variable in proxy_pass so “backend”
  # resolves at request time (avoids stale IP / startup order 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    set $awdms_upstream http://backend:4000;
    proxy_pass $awdms_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
