# Example: system nginx (HTTPS on 443) in front of Docker AWDMS.
# Docker maps: UI → 127.0.0.1:8080, API → 127.0.0.1:4000 (see docker-compose.prod.yml).
#
# Option A — one upstream (Docker UI nginx proxies /api to backend itself):
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# Option B — split (use if /api still 502 with A; API then hits Node directly):
#   location /api/ {
#       proxy_pass http://127.0.0.1:4000/api/;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# Do NOT set location /api to an IP that has nothing listening (causes 502).
